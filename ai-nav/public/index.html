<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 前沿导航 · 大模型 · Agent · 工具</title>
  <meta name="description" content="聚合全球与国内最新大模型、AI Agent、热门工具，附术语词典、发展时间线、模型对比与每日资讯。">
  <meta property="og:title" content="AI 前沿导航 · 大模型 · Agent · 工具">
  <meta property="og:description" content="聚合全球与国内最新大模型、AI Agent、热门工具，附术语词典、发展时间线、模型对比与每日资讯。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='68' font-size='48' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>AI</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#nav">
        <span class="brand-mark">AI</span>
        <span class="brand-text">前沿导航<em>模型 · Agent · 工具</em></span>
      </a>
      <div class="topbar-actions">
        <a class="ghost-btn" href="https://github.com/kkkznsnnsjuhhhgyawgbsbbsbsbsbssh1111/-vv" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs wrap" id="tabs">
      <button class="tab active" data-tab="nav">导航</button>
      <button class="tab" data-tab="news">资讯</button>
      <button class="tab" data-tab="glossary">术语</button>
      <button class="tab" data-tab="timeline">时间线</button>
      <button class="tab" data-tab="compare">对比</button>
    </nav>
  </header>

  <main class="wrap">
    <!-- 导航 -->
    <section class="view active" id="view-nav">
      <div class="hero">
        <h1>看清 AI 前沿，一页掌握</h1>
        <p class="hero-sub">聚合全球与国内最新大模型、AI Agent 与热门工具，每日自动更新资讯。</p>
        <div class="stats"><b id="statTotal">0</b> 条收录<span class="stat-dot"></span>更新于 <b id="statUpdated">—</b></div>
      </div>
      <div class="controls">
        <div class="seg-group" data-filter="region">
          <button class="seg active" data-val="all">全部</button>
          <button class="seg" data-val="global">全球</button>
          <button class="seg" data-val="china">国内</button>
        </div>
        <div class="seg-group" data-filter="category">
          <button class="seg active" data-val="all">全部</button>
          <button class="seg" data-val="model">大模型</button>
          <button class="seg" data-val="agent">Agent</button>
          <button class="seg" data-val="tool">工具</button>
        </div>
        <div class="search-sort">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="searchInput" type="search" placeholder="搜索名称 / 厂商 / 标签…" autocomplete="off">
          </div>
          <select class="select" id="sortSelect">
            <option value="recent">最新发布</option>
            <option value="hot">热门优先</option>
            <option value="name">名称</option>
          </select>
        </div>
      </div>
      <div class="picks" id="picks"></div>
      <!-- 骨架屏 -->
      <div class="grid skeleton-grid" id="skeletonGrid">
        <div class="sk-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w60"></div><div class="sk-line w30"></div></div></div><div class="sk-body"><div class="sk-line w100"></div><div class="sk-line w90"></div><div class="sk-line w70"></div></div><div class="sk-tags"><div class="sk-tag"></div><div class="sk-tag"></div></div></div>
        <div class="sk-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w50"></div><div class="sk-line w30"></div></div></div><div class="sk-body"><div class="sk-line w100"></div><div class="sk-line w80"></div><div class="sk-line w60"></div></div><div class="sk-tags"><div class="sk-tag"></div><div class="sk-tag"></div></div></div>
        <div class="sk-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w55"></div><div class="sk-line w35"></div></div></div><div class="sk-body"><div class="sk-line w100"></div><div class="sk-line w85"></div><div class="sk-line w65"></div></div><div class="sk-tags"><div class="sk-tag"></div><div class="sk-tag"></div></div></div>
        <div class="sk-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w60"></div><div class="sk-line w25"></div></div></div><div class="sk-body"><div class="sk-line w100"></div><div class="sk-line w90"></div><div class="sk-line w70"></div></div><div class="sk-tags"><div class="sk-tag"></div><div class="sk-tag"></div></div></div>
        <div class="sk-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w50"></div><div class="sk-line w30"></div></div></div><div class="sk-body"><div class="sk-line w100"></div><div class="sk-line w80"></div><div class="sk-line w60"></div></div><div class="sk-tags"><div class="sk-tag"></div><div class="sk-tag"></div></div></div>
        <div class="sk-card"><div class="sk-head"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line w55"></div><div class="sk-line w35"></div></div></div><div class="sk-body"><div class="sk-line w100"></div><div class="sk-line w85"></div><div class="sk-line w65"></div></div><div class="sk-tags"><div class="sk-tag"></div><div class="sk-tag"></div></div></div>
      </div>
      <div class="grid" id="grid" hidden></div>
      <div class="empty" id="empty" hidden>没有匹配的条目</div>
    </section>

    <!-- 资讯 -->
    <section class="view" id="view-news">
      <div class="view-head">
        <h2>资讯流</h2>
        <span class="view-sub" id="newsMeta"></span>
      </div>
      <div class="news-list" id="newsList"></div>
    </section>

    <!-- 术语 -->
    <section class="view" id="view-glossary">
      <div class="view-head">
        <h2>术语词典</h2>
        <span class="view-sub">看不懂的概念，一句话讲明白</span>
      </div>
      <div class="controls">
        <div class="seg-group" data-filter="glevel">
          <button class="seg active" data-val="all">全部</button>
          <button class="seg" data-val="入门">入门</button>
          <button class="seg" data-val="进阶">进阶</button>
          <button class="seg" data-val="前沿">前沿</button>
        </div>
        <div class="seg-group" data-filter="gcat">
          <button class="seg active" data-val="all">全部分类</button>
          <button class="seg" data-val="架构基础">架构基础</button>
          <button class="seg" data-val="训练方法">训练方法</button>
          <button class="seg" data-val="部署优化">部署优化</button>
          <button class="seg" data-val="应用范式">应用范式</button>
          <button class="seg" data-val="AI安全">AI安全</button>
        </div>
        <div class="search-sort">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="glossarySearch" type="search" placeholder="搜索术语…" autocomplete="off">
          </div>
          <select class="select" id="glossarySort">
            <option value="level">按难度</option>
            <option value="year">按年份</option>
          </select>
        </div>
      </div>
      <div class="glossary-list" id="glossaryList"></div>
    </section>

    <!-- 时间线 -->
    <section class="view" id="view-timeline">
      <div class="view-head">
        <h2>AI 发展时间线</h2>
        <span class="view-sub" id="timelineMeta">从 Transformer 到 Agent 元年</span>
      </div>
      <div class="controls">
        <div class="seg-group" data-filter="ttype">
          <button class="seg active" data-val="all">全部</button>
          <button class="seg" data-val="论文">论文</button>
          <button class="seg" data-val="产品">产品</button>
          <button class="seg" data-val="开源">开源</button>
          <button class="seg" data-val="里程碑">里程碑</button>
          <button class="seg" data-val="政策">政策</button>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- 对比 -->
    <section class="view" id="view-compare">
      <div class="view-head">
        <h2>模型对比</h2>
        <span class="view-sub">勾选 2–6 个模型横评能力</span>
      </div>
      <div class="compare-search">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="compareSearch" type="search" placeholder="筛选模型…" autocomplete="off">
        </div>
        <span class="view-sub" id="compareCount">已选 0 / 6</span>
      </div>
      <div class="compare-pick" id="comparePick"></div>
      <div class="compare-table-wrap" id="compareTable"></div>
    </section>
  </main>

  <!-- 回到顶部 -->
  <button class="back-top" id="backTop" aria-label="回到顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>AI 前沿导航 · 数据自动更新 · 仅供学习参考</span>
      <span>Powered by Cloudflare Pages</span>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
